<!-- @dsCard group="Colors" viewport="700x170" name="Status Colors" subtitle="Verde, mostaza y rojo sobrios: solo para estado y acciones" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--color-text-primary);background:var(--white)}.wrap{padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px}.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 14px;border-radius:999px;font-size:14px;font-weight:600}.dot{width:8px;height:8px;border-radius:50%}.row{display:flex;align-items:center;gap:14px}code{font-family:ui-monospace,monospace;font-size:12px;color:var(--gray-600)}a{color:var(--black)}a:hover{color:var(--gray-600)}</style>
<div class="wrap">
<div class="row">
<span class="pill" style="border:1px solid rgba(56,142,60,.4);color:var(--status-good)"><span class="dot" style="background:var(--status-good)"></span>Operativo</span>
<span class="pill" style="border:1px solid rgba(245,127,23,.45);color:var(--status-regular)"><span class="dot" style="background:var(--status-regular)"></span>En revisión</span>
<span class="pill" style="border:1px solid rgba(211,47,47,.4);color:var(--status-bad)"><span class="dot" style="background:var(--status-bad)"></span>Crítico</span>
</div>
<div class="row" style="gap:26px">
<div class="row"><span style="width:22px;height:22px;border-radius:6px;background:var(--status-good)"></span><code>--status-good #388e3c</code></div>
<div class="row"><span style="width:22px;height:22px;border-radius:6px;background:var(--status-regular)"></span><code>--status-regular #f57f17</code></div>
<div class="row"><span style="width:22px;height:22px;border-radius:6px;background:var(--status-bad)"></span><code>--status-bad #d32f2f</code></div>
</div>
<p style="margin:0;font-size:12px;color:var(--gray-600)">Uso en texto, punto o borde sutil. Nunca como relleno de superficies grandes ni en fondos de lámina.</p>
</div>
