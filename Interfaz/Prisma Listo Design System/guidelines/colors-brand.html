<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--color-text-primary);background:var(--white)}.wrap{padding:24px;box-sizing:border-box}.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-600)}a{color:var(--black)}a:hover{color:var(--gray-600)}</style>
<div class="wrap" style="display:flex;gap:12px">
<div style="flex:1"><div style="height:64px;background:var(--white);border:1px solid var(--color-border);border-radius:var(--radius-md)"></div><div style="margin-top:8px;font-size:14px;font-weight:600">Blanco</div><div style="font-size:12px;color:var(--gray-600)">#ffffff · --white</div></div>
<div style="flex:1"><div style="height:64px;background:var(--gray-300);border-radius:var(--radius-md)"></div><div style="margin-top:8px;font-size:14px;font-weight:600">Gris de marca</div><div style="font-size:12px;color:var(--gray-600)">#c6c6c6 · --color-brand-accent</div></div>
<div style="flex:1"><div style="height:64px;background:var(--white);border:1px solid var(--color-border);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center"><span style="font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--black)">Aa</span></div><div style="margin-top:8px;font-size:14px;font-weight:600">Negro · solo texto</div><div style="font-size:12px;color:var(--gray-600)">#000000 · --color-text-primary</div></div>
</div>
