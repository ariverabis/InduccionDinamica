<!-- @dsCard group="Colors" viewport="700x150" name="Button Color Tokens" subtitle="Reposo, hover a negro, press al 70%, deshabilitado al 40%" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--color-text-primary);background:var(--white)}.wrap{padding:24px;box-sizing:border-box}.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-600)}a{color:var(--black)}a:hover{color:var(--gray-600)}</style>
<div class="wrap" style="display:flex;gap:12;align-items:flex-end;font-size:12px;color:var(--gray-600);text-align:center">
<div style="flex:1"><div style="height:44px;border-radius:var(--radius-md);background:var(--color-btn-primary-bg)"></div><div style="margin-top:6px">reposo · gray-300</div></div>
<div style="flex:1"><div style="height:44px;border-radius:var(--radius-md);background:var(--color-btn-primary-hover)"></div><div style="margin-top:6px">hover · negro</div></div>
<div style="flex:1"><div style="height:44px;border-radius:var(--radius-md);background:var(--color-btn-primary-press)"></div><div style="margin-top:6px">press · 70%</div></div>
<div style="flex:1"><div style="height:44px;border-radius:var(--radius-md);background:var(--color-btn-disabled-bg)"></div><div style="margin-top:6px">disabled · 40%</div></div>
<div style="flex:1"><div style="height:44px;border-radius:var(--radius-md);background:var(--white);border:1px solid var(--color-btn-secondary-border)"></div><div style="margin-top:6px">secundario</div></div>
</div>
