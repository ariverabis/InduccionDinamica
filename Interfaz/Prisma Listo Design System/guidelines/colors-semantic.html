<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--color-text-primary);background:var(--white)}.wrap{padding:24px;box-sizing:border-box}.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-600)}a{color:var(--black)}a:hover{color:var(--gray-600)}</style>
<div class="wrap" style="display:grid;grid-template-columns:1fr 1fr;gap:10;font-size:12px">
<div style="display:flex;align-items:center;gap:10"><span style="width:22px;height:22px;border-radius:6px;background:#000000;border:1px solid var(--color-border)"></span><code style="font-family:ui-monospace,monospace">--color-text-primary</code><span style="color:var(--gray-500)">#000000</span></div><div style="display:flex;align-items:center;gap:10"><span style="width:22px;height:22px;border-radius:6px;background:#666666;border:1px solid var(--color-border)"></span><code style="font-family:ui-monospace,monospace">--color-text-secondary</code><span style="color:var(--gray-500)">#666666</span></div><div style="display:flex;align-items:center;gap:10"><span style="width:22px;height:22px;border-radius:6px;background:#8a8a8a;border:1px solid var(--color-border)"></span><code style="font-family:ui-monospace,monospace">--color-text-muted</code><span style="color:var(--gray-500)">#8a8a8a</span></div><div style="display:flex;align-items:center;gap:10"><span style="width:22px;height:22px;border-radius:6px;background:#f9fafb;border:1px solid var(--color-border)"></span><code style="font-family:ui-monospace,monospace">--color-surface-sunken</code><span style="color:var(--gray-500)">#f9fafb</span></div><div style="display:flex;align-items:center;gap:10"><span style="width:22px;height:22px;border-radius:6px;background:#e2e2e2;border:1px solid var(--color-border)"></span><code style="font-family:ui-monospace,monospace">--color-border</code><span style="color:var(--gray-500)">#e2e2e2</span></div><div style="display:flex;align-items:center;gap:10"><span style="width:22px;height:22px;border-radius:6px;background:#c6c6c6;border:1px solid var(--color-border)"></span><code style="font-family:ui-monospace,monospace">--color-border-strong</code><span style="color:var(--gray-500)">#c6c6c6</span></div>
</div>
