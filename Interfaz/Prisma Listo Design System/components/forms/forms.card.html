<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:28px;background:var(--white);box-sizing:border-box"></div>
<script type="text/babel">
const { Button, Input, Select, Checkbox, Radio, Switch } = window.PrismaDesignSystem_5fbffe;
function Demo(){
  const [chk,setChk]=React.useState(true);
  const [rad,setRad]=React.useState('a');
  const [sw,setSw]=React.useState(true);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:26,fontFamily:'var(--font-body)'}}>
      <div style={{display:'flex',gap:12,alignItems:'center'}}>
        <Button variant="primary">Guardar</Button>
        <Button variant="secondary">Cancelar</Button>
        <Button variant="ghost">Ver más</Button>
        <Button variant="disabled">No disponible</Button>
        <Button variant="primary" size="sm">Pequeño</Button>
      </div>
      <div style={{display:'flex',gap:24}}>
        <div style={{flex:1}}><Input label="Nombre del comercio" placeholder="Ferretería El Tornillo" /></div>
        <div style={{flex:1}}><Select label="País" options={['Venezuela','Colombia','Costa Rica']} /></div>
        <div style={{flex:1}}><Input label="RIF" value="J-40028891-7" disabled /></div>
      </div>
      <div style={{display:'flex',gap:26,alignItems:'center'}}>
        <Checkbox label="Acepto términos" checked={chk} onChange={setChk} />
        <Radio label="Retiro en tienda" checked={rad==='a'} onChange={()=>setRad('a')} />
        <Radio label="Envío a domicilio" checked={rad==='b'} onChange={()=>setRad('b')} />
        <div style={{display:'flex',alignItems:'center',gap:10,fontSize:'var(--fs-body)'}}><Switch checked={sw} onChange={setSw} />Notificaciones</div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
