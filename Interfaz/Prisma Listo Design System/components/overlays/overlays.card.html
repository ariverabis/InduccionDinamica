<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:20px;background:var(--white)"></div>
<script type="text/babel">
const { Dialog, Button } = window.PrismaDesignSystem_5fbffe;
function Demo(){
  const [open,setOpen] = React.useState(true);
  return (
    <div style={{fontFamily:'var(--font-body)'}}>
      <div style={{position:'relative',height:300,overflow:'hidden',background:'var(--gray-100)',border:'1px solid var(--color-border)',borderRadius:'var(--radius-md)'}}>
        <div style={{padding:20,fontSize:'var(--fs-body)',color:'var(--color-text-muted)'}}>Contenido de la página detrás del diálogo</div>
        {open
          ? <Dialog inline title="¿Publicar esta página?" confirmLabel="Publicar" cancelLabel="Cancelar" onConfirm={()=>setOpen(false)} onCancel={()=>setOpen(false)}>Queda disponible en su URL actual. Puede despublicarla en cualquier momento y nada más del sitio cambia.</Dialog>
          : <div style={{position:'absolute',inset:0,display:'grid',placeItems:'center'}}><Button variant="secondary" onClick={()=>setOpen(true)}>Abrir diálogo</Button></div>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
